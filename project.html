<style>
/* ── RESET & BASE ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080c14;
  --bg2: #0d1220;
  --bg3: #111827;
  --teal: #00e5a0;
  --teal-dim: rgba(0,229,160,0.12);
  --teal-mid: rgba(0,229,160,0.35);
  --amber: #f0a500;
  --text: #e8edf5;
  --text-muted: #a8b8cc;
  --text-dim: #7a8fa8;
  --border: rgba(255,255,255,0.07);
  --border-teal: rgba(0,229,160,0.25);
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}
::selection { background: var(--teal); color: var(--bg); }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  pointer-events: none;
  z-index: 9999;
}

/* ── NAV ───────────────────────────────────────────────── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.5rem;
  height: 64px;
  background: rgba(8,12,20,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  letter-spacing: 0.05em;
  text-decoration: none;
}
.nav-logo img { height: 36px; width: 36px; object-fit: contain; }
.nav-logo span { color: var(--teal); }
.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}
.nav-links a {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--teal); }
.nav-links a.active { color: var(--teal); }
.nav-cta {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--teal);
  text-decoration: none;
  border: 1px solid var(--border-teal);
  padding: 8px 18px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.2s;
}
.nav-cta:hover { background: var(--teal-dim); }
/* ── LANG BUTTON ────────────────────────────────────────── */
.lang-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 5px 10px;
  letter-spacing: 0.08em;
  transition: border-color 0.2s;
  white-space: nowrap;
}
.lang-btn:hover { border-color: var(--border-teal); }
.lang-btn [data-lang] { color: var(--text-dim); transition: color 0.2s; }
.lang-btn [data-lang].lang-active { color: var(--teal); }
.lang-btn .lang-sep { color: var(--border); margin: 0 4px; }
/* ── NAV BURGER / MOBILE MENU ───────────────────────────── */
.nav-burger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
  z-index: 101;
}
.nav-burger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: transform 0.3s, opacity 0.3s;
}
.nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.nav-mobile {
  display: none;
  position: fixed;
  top: 64px;
  left: 0; right: 0;
  background: rgba(8,12,20,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 99;
  padding: 1rem 1.25rem 1.5rem;
  flex-direction: column;
}
.nav-mobile.open { display: flex; }
.nav-mobile a {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--border);
  transition: color 0.2s;
}
.nav-mobile a:last-child { border-bottom: none; }
.nav-mobile a:hover, .nav-mobile a.active { color: var(--teal); }
.nav-mobile .nav-mobile-cta {
  margin-top: 1rem;
  color: var(--teal);
  border: 1px solid var(--border-teal) !important;
  padding: 0.75rem 1rem !important;
  text-align: center;
  border-bottom: none !important;
}

/* ──PROJECT HERO ──────────────────────────────────────── */
.project-hero {
  position: relative;
  margin-top: 64px;
  height: 55vh;
  min-height: 320px;
  overflow: hidden;
  background: var(--bg3);
}
.project-hero-img {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.project-hero-img.no-image {
  background-image:
    linear-gradient(rgba(0,229,160,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,160,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
}
.project-hero-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(8,12,20,0.95) 0%, rgba(8,12,20,0.3) 60%, transparent 100%);
}
.project-hero-content {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  padding: 2.5rem;
  max-width: 1100px;
  margin: 0 auto;
}
.project-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 1.5rem;
  transition: color 0.2s;
}
.project-back::before { content: '←'; }
.project-back:hover { color: var(--teal); }
.project-category {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 0.5rem;
}
.project-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
}
.project-client {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
}

/* ── PROJECT BODY ──────────────────────────────────────── */
.project-body {
  max-width: 1100px;
  margin: 0 auto;
  padding: 4rem 2.5rem;
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 4rem;
  align-items: start;
}

/* Meta sidebar */
.project-meta {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  position: sticky;
  top: 88px;
}
.project-meta-item {}
.project-meta-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.project-meta-value {
  font-size: 14px;
  color: var(--text);
}
.project-meta-divider {
  height: 1px;
  background: var(--border);
}
.project-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--teal);
  text-decoration: none;
  border: 1px solid var(--border-teal);
  padding: 10px 16px;
  transition: all 0.2s;
}
.project-link-btn::after { content: '↗'; }
.project-link-btn:hover { background: var(--teal-dim); }

/* Main content */
.project-content {}
.project-description {
  font-size: 1rem;
  line-height: 1.85;
  color: var(--text-muted);
}
.project-description h1,
.project-description h2,
.project-description h3 {
  font-family: var(--font-display);
  color: var(--text);
  margin: 2rem 0 0.75rem;
}
.project-description h2 { font-size: 1.4rem; }
.project-description h3 { font-size: 1.1rem; }
.project-description p { margin-bottom: 1.2rem; }
.project-description ul,
.project-description ol {
  padding-left: 1.5rem;
  margin-bottom: 1.2rem;
}
.project-description a { color: var(--teal); text-decoration: underline; }
.project-description strong { color: var(--text); }
.project-description img {
  max-width: 100%;
  height: auto;
  margin: 0.5rem 0 1.2rem;
}
.project-description iframe {
  width: 100%;
  max-width: 560px;
  aspect-ratio: 16 / 9;
  height: auto;
  border: 1px solid var(--border);
  margin: 0.5rem 0 1.2rem;
}
.project-description pre {
  overflow-x: auto;
  max-width: 100%;
}

/* Video embed */
.project-video {
  margin-top: 3rem;
}
.project-video-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.project-video-label::before { content: '//'; opacity: 0.4; }
.project-video-wrap {
  position: relative;
  padding-bottom: 56.25%;
  overflow: hidden;
  border: 1px solid var(--border);
}
.project-video-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* Gallery */
.project-gallery {
  margin-top: 3rem;
}
.project-gallery-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.project-gallery-label::before { content: '//'; opacity: 0.4; }
.project-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.75rem;
}
.project-gallery-item {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 1px solid var(--border);
  background: var(--bg2);
  cursor: zoom-in;
  overflow: hidden;
  transition: border-color 0.2s;
}
.project-gallery-item:hover,
.project-gallery-item:focus-visible { border-color: var(--border-teal); }
.project-gallery-item:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.project-gallery-img {
  aspect-ratio: 16 / 9;
  object-fit: cover;
  width: 100%;
  display: block;
  transition: transform 0.4s ease;
}
.project-gallery-item:hover .project-gallery-img { transform: scale(1.04); }
.project-gallery-zoom {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8,12,20,0.75);
  border: 1px solid var(--border-teal);
  color: var(--teal);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.project-gallery-item:hover .project-gallery-zoom,
.project-gallery-item:focus-visible .project-gallery-zoom { opacity: 1; }
.project-gallery-zoom svg { width: 14px; height: 14px; }

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(4,7,12,0.94);
  backdrop-filter: blur(6px);
  padding: 4rem 4.5rem;
}
.lightbox.open { display: flex; }
.lightbox-figure {
  margin: 0;
  max-width: 100%;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.9rem;
}
.lightbox-img {
  max-width: 100%;
  max-height: calc(100vh - 10rem);
  width: auto;
  height: auto;
  object-fit: contain;
  border: 1px solid var(--border-teal);
  display: block;
}
.lightbox-caption {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-align: center;
  max-width: 60ch;
}
.lightbox-counter {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--teal);
}
.lightbox-btn {
  position: absolute;
  background: rgba(8,12,20,0.8);
  border: 1px solid var(--border);
  color: var(--text);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.lightbox-btn:hover,
.lightbox-btn:focus-visible {
  border-color: var(--border-teal);
  color: var(--teal);
  background: var(--bg2);
}
.lightbox-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.lightbox-btn svg { width: 18px; height: 18px; }
.lightbox-close { top: 1.25rem; right: 1.25rem; }
.lightbox-prev { left: 1.25rem; top: 50%; transform: translateY(-50%); }
.lightbox-next { right: 1.25rem; top: 50%; transform: translateY(-50%); }
.lightbox.single .lightbox-prev,
.lightbox.single .lightbox-next,
.lightbox.single .lightbox-counter { display: none; }
body.lightbox-open { overflow: hidden; }

@media (max-width: 640px) {
  .lightbox { padding: 4rem 1rem 5.5rem; }
  .lightbox-img { max-height: calc(100vh - 12rem); }
  .lightbox-prev { left: 1rem; top: auto; bottom: 1rem; transform: none; }
  .lightbox-next { right: 1rem; top: auto; bottom: 1rem; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .project-gallery-item:hover .project-gallery-img { transform: none; }
}

/* Accolades */
.project-accolades { margin-top: 3rem; }
.project-accolades-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.project-accolades-label::before { content: '//'; opacity: 0.4; }
.project-accolade {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--border);
}
.project-accolade:last-child { border-bottom: none; }
.project-accolade-title { font-size: 14px; color: var(--text); flex: 1; }
.project-accolade-event { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.project-accolade-year { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }

/* Not found */
.project-not-found {
  text-align: center;
  padding: 8rem 2rem;
}
.project-not-found h2 {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 1rem;
}
.project-not-found p {
  color: var(--text-muted);
  margin-bottom: 2rem;
}

/* ── FOOTER ────────────────────────────────────────────── */
footer {
  padding: 2rem 2.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.footer-left {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
}
.footer-right {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}
.footer-right span { color: var(--teal); }

/* ── MOBILE ────────────────────────────────────────────── */
@media (max-width: 768px) {
  nav { padding: 0 1.25rem; }
  .nav-links { display: none; }
  .nav-cta { display: none; }
  .nav-burger { display: flex; }
  .project-hero-content { padding: 1.5rem; }
  .project-body {
    grid-template-columns: 1fr;
    padding: 2.5rem 1.25rem;
    gap: 2.5rem;
  }
  .project-meta { position: static; }
  footer { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

<script>
// ── NAVBAR SCROLL STYLE ────────────────────────────────────
window.addEventListener('scroll', function () {
  var nav = document.querySelector('nav');
  nav.style.borderBottomColor = window.scrollY > 40
    ? 'rgba(0,229,160,0.15)'
    : 'rgba(255,255,255,0.07)';
});

// ── MOBILE MENU ────────────────────────────────────────────
(function () {
  var burger = document.getElementById('nav-burger');
  var menu = document.getElementById('nav-mobile');
  if (!burger || !menu) return;
  burger.addEventListener('click', function () {
    var open = menu.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', String(open));
  });
  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () {
      menu.classList.remove('open');
      burger.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });
})();

// ── PROJECT PAGE ───────────────────────────────────────────
(function () {
  var params = new URLSearchParams(window.location.search);
  var projectId = params.get('id');

  function tr(key) { return window.I18n ? window.I18n.t(key) : key; }

  // "id" is what links a card to its project page, but it is an optional CMS
  // field and easy to leave blank, which used to render a card unclickable.
  // Fall back to a slug derived from the title; an explicit id always wins,
  // so existing project URLs are unchanged.
  function slugify(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }
  function idOf(p) { return (p && p.id) || slugify(p && p.title); }

  // Resolve a possibly-localized value ({fr,en,pt}) for the current language.
  function loc(val) {
    if (val && typeof val === 'object' && !Array.isArray(val)) {
      var lang = window.I18n ? window.I18n.getLang() : 'fr';
      return val[lang] || val.fr || val.en || '';
    }
    return val;
  }

  function curLang() { return window.I18n ? window.I18n.getLang() : 'fr'; }

  // Strip HTML + Markdown down to plain text (for structured-data descriptions).
  function plain(s) {
    return String(s || '')
      .replace(/\{\{\s*(?:youtube|vimeo|video)\s*:[^}]+?\}\}/gi, '')
      .replace(/<[^>]+>/g, '')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[*_`#>]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function injectJsonLd(id, obj) {
    var el = document.getElementById(id);
    if (!el) {
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = id;
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify(obj);
  }

  function renderNotFound() {
    var root = document.getElementById('project-root');
    root.innerHTML =
      '<div class="project-not-found">' +
        '<h2>' + esc(tr('project.notfound.h2')) + '</h2>' +
        '<p>' + esc(tr('project.notfound.p')) + '</p>' +
        '<a href="portfolio.html" class="project-back" style="display:inline-flex;margin:0 auto;">' + esc(tr('project.back')) + '</a>' +
      '</div>';
    document.title = 'Mario J. Ramos — ' + tr('project.notfound.h2');
  }

  function rel(path) { return path ? path.replace(/^\//, '') : path; }

  function toEmbedUrl(url) {
    if (!url) return null;
    var yt = url.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if (yt) return 'https://www.youtube.com/embed/' + yt[1];
    var vimeo = url.match(/vimeo\.com\/(\d+)/);
    if (vimeo) return 'https://player.vimeo.com/video/' + vimeo[1];
    return url;
  }

  // Shortcodes let editors embed a video inside the description body without
  // pasting raw <iframe> HTML (which the CMS rich-text editor strips on save).
  // Supported: {{youtube:ID}}, {{youtube:URL}}, {{vimeo:ID}}, {{vimeo:URL}}, {{video:URL}}
  var VIDEO_SHORTCODE_RE = /\{\{\s*(youtube|vimeo|video)\s*:\s*([^}]+?)\s*\}\}/gi;

  function shortcodeToEmbed(kind, value) {
    kind = kind.toLowerCase();
    if (kind === 'youtube' && /^[a-zA-Z0-9_-]{11}$/.test(value)) {
      return 'https://www.youtube.com/embed/' + value;
    }
    if (kind === 'vimeo' && /^\d+$/.test(value)) {
      return 'https://player.vimeo.com/video/' + value;
    }
    return toEmbedUrl(value);
  }

  function expandVideoShortcodes(md) {
    if (!md) return md;
    return md.replace(VIDEO_SHORTCODE_RE, function (match, kind, raw) {
      var embed = shortcodeToEmbed(kind, raw.trim());
      if (!embed) return match;
      // Surround with blank lines so marked treats it as a raw HTML block.
      return '\n\n<iframe src="' + esc(embed) +
        '" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>\n\n';
    });
  }

  function setMeta(name, val) {
    var el = document.querySelector('meta[name="' + name + '"], meta[property="' + name + '"]');
    if (el && val) el.setAttribute('content', val);
  }

  function renderProject(project, categoryLabels) {
    document.title = 'Mario J. Ramos — ' + project.title;

    var descText = loc(project.description);
    var seoDesc = project.seo_description || (descText
      ? descText.replace(VIDEO_SHORTCODE_RE, '').replace(/<[^>]+>/g, '').slice(0, 160).trim()
      : '');
    var coverSrc = rel(project.cover);
    var coverAbs = coverSrc ? 'https://mariojramos.com/' + coverSrc.replace(/^\//, '') : '';

    setMeta('description', seoDesc);
    setMeta('og:title', 'Mario J. Ramos — ' + project.title);
    setMeta('og:description', seoDesc);
    setMeta('og:url', window.location.href);
    setMeta('og:image', coverAbs);
    setMeta('twitter:title', 'Mario J. Ramos — ' + project.title);
    setMeta('twitter:description', seoDesc);
    setMeta('twitter:image', coverAbs);

    var categoryLabel = categoryLabels[project.category] || project.category || '';

    // Hero
    var heroImgClass = coverSrc ? 'project-hero-img' : 'project-hero-img no-image';
    var coverAlt = esc(loc(project.cover_alt) || project.title);
    var heroImgStyle = coverSrc ? ' style="background-image:url(\'' + coverSrc + '\')"' : '';

    // Meta items
    var metaHTML = '';
    if (categoryLabel) {
      metaHTML += '<div class="project-meta-item"><div class="project-meta-label">' + esc(tr('project.meta.category')) + '</div><div class="project-meta-value">' + esc(categoryLabel) + '</div></div>';
    }
    if (project.role) {
      metaHTML += '<div class="project-meta-item"><div class="project-meta-label">' + esc(tr('project.meta.role')) + '</div><div class="project-meta-value">' + esc(loc(project.role)) + '</div></div>';
    }
    if (project.medium) {
      metaHTML += '<div class="project-meta-item"><div class="project-meta-label">' + esc(tr('project.meta.medium')) + '</div><div class="project-meta-value">' + esc(loc(project.medium)) + '</div></div>';
    }
    if (project.year) {
      metaHTML += '<div class="project-meta-item"><div class="project-meta-label">' + esc(tr('project.meta.year')) + '</div><div class="project-meta-value">' + esc(String(project.year)) + '</div></div>';
    }
    if (project.link) {
      metaHTML += '<div class="project-meta-divider"></div><a href="' + esc(project.link) + '" target="_blank" rel="noopener" class="project-link-btn">' + esc(tr('project.meta.link')) + '</a>';
    }

    // Video embed
    var videoHTML = '';
    var embedUrl = toEmbedUrl(project.video);
    if (embedUrl) {
      videoHTML = '<div class="project-video">' +
        '<div class="project-video-label">' + esc(tr('project.video.label')) + '</div>' +
        '<div class="project-video-wrap">' +
          '<iframe src="' + esc(embedUrl) + '" allowfullscreen loading="lazy"></iframe>' +
        '</div>' +
      '</div>';
    }

    // Gallery
    var accoladesHTML = '';
    if (project.accolades && project.accolades.length) {
      var acItems = project.accolades.map(function (a) {
        return '<div class="project-accolade">' +
          (a.title ? '<span class="project-accolade-title">' + esc(loc(a.title)) + '</span>' : '') +
          (a.event ? '<span class="project-accolade-event">' + esc(a.event) + '</span>' : '') +
          (a.year  ? '<span class="project-accolade-year">'  + esc(String(a.year)) + '</span>' : '') +
        '</div>';
      }).join('');
      accoladesHTML = '<div class="project-accolades"><div class="project-accolades-label">' + esc(tr('project.accolades.label')) + '</div>' + acItems + '</div>';
    }

    var galleryHTML = '';
    galleryItems = [];
    if (project.gallery && project.gallery.length) {
      galleryItems = project.gallery.map(function (item) {
        return {
          src: rel((typeof item === 'string') ? item : item.src),
          alt: (typeof item === 'string') ? '' : (loc(item.alt) || '')
        };
      }).filter(function (item) { return !!item.src; });

      var zoomLabel = tr('project.gallery.zoom');
      var imgs = galleryItems.map(function (item, i) {
        return '<button type="button" class="project-gallery-item" data-gallery-index="' + i + '" ' +
            'aria-label="' + esc(item.alt || zoomLabel) + '">' +
          '<img class="project-gallery-img" src="' + esc(item.src) + '" alt="' + esc(item.alt) + '" loading="lazy">' +
          '<span class="project-gallery-zoom" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/>' +
            '</svg>' +
          '</span>' +
        '</button>';
      }).join('');
      galleryHTML = '<div class="project-gallery">' +
        '<div class="project-gallery-label">' + esc(tr('project.gallery.label')) + '</div>' +
        '<div class="project-gallery-grid">' + imgs + '</div>' +
      '</div>';
    }

    var root = document.getElementById('project-root');
    root.innerHTML =
      '<div class="project-hero">' +
        '<div class="' + heroImgClass + '" role="img" aria-label="' + coverAlt + '"' + heroImgStyle + '></div>' +
        '<div class="project-hero-gradient"></div>' +
        '<div class="project-hero-content">' +
          '<a href="portfolio.html" class="project-back">' + esc(tr('project.back')) + '</a>' +
          (categoryLabel ? '<div class="project-category">' + esc(categoryLabel) + '</div>' : '') +
          '<h1 class="project-title">' + esc(project.title) + '</h1>' +
          (project.client ? '<div class="project-client">' + esc(project.client) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="project-body">' +
        '<div class="project-content">' +
          (descText
            ? '<div class="project-description">' + (typeof marked !== 'undefined' ? marked.parse(expandVideoShortcodes(descText)) : descText) + '</div>'
            : '') +
          videoHTML +
          accoladesHTML +
          galleryHTML +
        '</div>' +
        '<aside class="project-meta">' + metaHTML + '</aside>' +
      '</div>';

    // Structured data (GEO/SEO) — describes this project as a CreativeWork
    // authored by Mario J. Ramos, in the active language.
    var ld = {
      '@context': 'https://schema.org',
      '@type': 'CreativeWork',
      'name': project.title,
      'inLanguage': curLang(),
      'url': window.location.href,
      'creator': { '@type': 'Person', 'name': 'Mario J. Ramos', 'url': 'https://mariojramos.com/#person' }
    };
    if (descText) ld.description = plain(descText);
    if (coverAbs) ld.image = coverAbs;
    if (categoryLabel) ld.genre = categoryLabel;
    if (project.role) ld.creditText = loc(project.role);
    if (project.year) ld.dateCreated = String(project.year);
    if (project.client) ld.sourceOrganization = { '@type': 'Organization', 'name': project.client };
    injectJsonLd('ld-project', ld);

    if (coverSrc) {
      var heroEl = root.querySelector('.project-hero-img');
      var loader = new Image();
      loader.onerror = function () {
        if (heroEl) { heroEl.className = 'project-hero-img no-image'; heroEl.style.backgroundImage = ''; }
      };
      loader.src = coverSrc;
    }
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── GALLERY LIGHTBOX ─────────────────────────────────────
  // Gallery tiles are cropped 16:9 thumbnails; clicking one opens the source
  // file at full resolution here. Items are kept in module scope so the
  // lightbox survives the re-render that a language switch triggers.
  var galleryItems = [];
  var lightboxIndex = 0;
  var lastFocused = null;
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightbox-img');
  var lbCaption = document.getElementById('lightbox-caption');
  var lbCounter = document.getElementById('lightbox-counter');
  var lbClose = document.getElementById('lightbox-close');
  var lbPrev = document.getElementById('lightbox-prev');
  var lbNext = document.getElementById('lightbox-next');

  function lightboxOpen() { return !!lb && lb.classList.contains('open'); }

  function syncLightboxLabels() {
    if (!lb) return;
    lb.setAttribute('aria-label', tr('project.gallery.label'));
    lbClose.setAttribute('aria-label', tr('project.lightbox.close'));
    lbPrev.setAttribute('aria-label', tr('project.lightbox.prev'));
    lbNext.setAttribute('aria-label', tr('project.lightbox.next'));
  }

  function preload(index) {
    var item = galleryItems[index];
    if (item) { var im = new Image(); im.src = item.src; }
  }

  function showLightbox(index) {
    if (!lb || !galleryItems.length) return;
    var count = galleryItems.length;
    lightboxIndex = ((index % count) + count) % count;
    var item = galleryItems[lightboxIndex];
    lbImg.src = item.src;
    lbImg.alt = item.alt;
    lbCaption.textContent = item.alt;
    lbCaption.style.display = item.alt ? '' : 'none';
    lbCounter.textContent = (lightboxIndex + 1) + ' / ' + count;
    lb.classList.toggle('single', count < 2);
    preload(lightboxIndex + 1);
    preload(lightboxIndex - 1);
  }

  function openLightbox(index) {
    if (!lb || !galleryItems.length) return;
    lastFocused = document.activeElement;
    syncLightboxLabels();
    showLightbox(index);
    lb.classList.add('open');
    document.body.classList.add('lightbox-open');
    lbClose.focus();
  }

  function closeLightbox() {
    if (!lightboxOpen()) return;
    lb.classList.remove('open');
    document.body.classList.remove('lightbox-open');
    lbImg.src = '';
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    lastFocused = null;
  }

  if (lb) {
    document.getElementById('project-root').addEventListener('click', function (e) {
      var tile = e.target.closest ? e.target.closest('.project-gallery-item') : null;
      if (!tile) return;
      openLightbox(parseInt(tile.getAttribute('data-gallery-index'), 10) || 0);
    });

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', function () { showLightbox(lightboxIndex - 1); });
    lbNext.addEventListener('click', function () { showLightbox(lightboxIndex + 1); });

    // Clicking the backdrop (anywhere but the image itself) dismisses.
    lb.addEventListener('click', function (e) {
      if (e.target === lbImg || (e.target.closest && e.target.closest('.lightbox-btn'))) return;
      closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
      if (!lightboxOpen()) return;
      if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
      else if (e.key === 'ArrowLeft' && galleryItems.length > 1) { e.preventDefault(); showLightbox(lightboxIndex - 1); }
      else if (e.key === 'ArrowRight' && galleryItems.length > 1) { e.preventDefault(); showLightbox(lightboxIndex + 1); }
      else if (e.key === 'Tab') {
        // Keep focus inside the dialog while it is open.
        var focusables = [lbClose, lbPrev, lbNext].filter(function (el) { return el.offsetParent !== null; });
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        else if (focusables.indexOf(document.activeElement) === -1) { e.preventDefault(); first.focus(); }
      }
    });
  }

  if (!projectId) { renderNotFound(); return; }

  Promise.all([
    fetch('categories.json').then(function (r) { return r.ok ? r.json() : { items: [] }; }),
    fetch('portfolio.json').then(function (r) { return r.ok ? r.json() : { items: [] }; })
  ]).then(function (results) {
    var categoryLabels = {};
    (results[0].items || []).forEach(function (c) { categoryLabels[c.id] = c.label; });

    var projects = results[1].items || results[1];
    var project = projects.find(function (p) { return idOf(p) === projectId; });

    if (!project) { renderNotFound(); return; }
    renderProject(project, categoryLabels);

    window.onLangChange = function () {
      closeLightbox();
      renderProject(project, categoryLabels);
    };
  }).catch(function () { renderNotFound(); });
}());
</script>
</body>
</html>
